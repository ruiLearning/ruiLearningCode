# 推送到 main 后自动生成博客，并发布到 ruiLearning.github.io
# 需要在本仓库 Settings → Secrets and variables → Actions 里添加 PAGES_TOKEN：
# 一个只授权 ruiLearning.github.io、Contents 为 Read and write 的 Fine-grained token
name: 部署博客

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查令牌
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::还没有设置 PAGES_TOKEN（Settings → Secrets and variables → Actions），无法发布"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 生成网站
        run: npx hexo clean && npx hexo generate

      - name: 发布到 ruiLearning.github.io
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/ruiLearning/ruiLearning.github.io.git" site
          rsync -a --delete --exclude '.git' public/ site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "网站内容没有变化，跳过发布"
          else
            git commit -q -m "Site updated: $(TZ=Asia/Shanghai date '+%F %T')"
            git push origin HEAD:main
          fi
